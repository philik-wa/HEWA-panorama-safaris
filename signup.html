<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Sign Up — Hewa Safaris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive.css">
<style>
  :root{
    color-scheme:light;
    --ink:#1B1712;
    --ink-soft:#2A241C;
    --sand:#F2E8D6;
    --sand-2:#EADFC7;
    --paper:#FAF5EA;
    --clay:#C1701E;
    --clay-deep:#96551A;
    --gold:#B8893A;
    --gold-light:#D1A550;
    --line:rgba(27,23,18,0.14);
    --shadow: 0 30px 60px -25px rgba(27,23,18,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:'Playfair Display', serif;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit; text-decoration:none;}
  h1,h2{font-family:'Playfair Display', serif; margin:0; font-weight:500;}
  .eyebrow{
    font-family:'Playfair Display', serif; text-transform:uppercase; letter-spacing:0.22em;
    font-size:12px; font-weight:600; color:var(--gold-light);
  }

  /* top bar */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    padding:28px 40px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-logo{height:46px;width:auto;display:block;background:var(--paper);border-radius:8px;padding:5px 10px;box-shadow:0 4px 14px -6px rgba(0,0,0,0.35);}
  .brand-name{font-family:'Playfair Display', serif; font-size:17px; letter-spacing:0.04em; text-transform:uppercase; font-weight:600; color:var(--paper);}
  .back-link{font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--paper); opacity:0.85; font-weight:600;}
  .back-link:hover{opacity:1; color:var(--gold-light);}

  .auth-shell{
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .auth-visual{
    position:relative;
    background-image:url('images/elephant-herd-savanna.jpg');
    background-size:cover; background-position:center 55%;
  }
  .auth-visual:after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(15,13,9,0.55) 0%, rgba(15,13,9,0.15) 40%, rgba(15,13,9,0.75) 100%);
  }
  .auth-visual-content{
    position:absolute; left:48px; right:48px; bottom:56px; z-index:2; color:var(--paper);
  }
  .auth-visual-content .quote{
    font-family:'Playfair Display', serif; font-size:26px; line-height:1.4; font-style:italic; max-width:440px;
  }
  .auth-visual-content .who{margin-top:20px; font-size:13px; color:rgba(250,245,234,0.75); letter-spacing:0.04em;}

  .auth-form-side{
    display:flex; align-items:center; justify-content:center;
    padding:60px 40px;
    background:var(--paper);
  }
  .auth-box{width:100%; max-width:400px;}
  .auth-box .eyebrow{color:var(--clay); display:block; margin-bottom:14px;}
  .auth-box h1{font-size:36px; line-height:1.1;}
  .auth-box .sub{font-size:14px; color:var(--ink-soft); margin-top:12px; font-weight:400;}
  .auth-box .sub a{color:var(--clay); font-weight:600; border-bottom:1px solid var(--clay);}

  form.auth-form{margin-top:36px;}
  .field{margin-bottom:22px;}
  .field label{
    display:block; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600; margin-bottom:8px;
  }
  .field input{
    width:100%; border:none; border-bottom:1px solid var(--line); background:none;
    padding:10px 2px; font-size:15px; font-family:'Playfair Display',serif; color:var(--ink);
    outline:none; transition:border-color .25s ease;
  }
  .field input:focus{border-color:var(--clay);}
  .field-row{display:flex; align-items:center; justify-content:space-between; margin-top:-6px; margin-bottom:26px;}
  .remember{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
  .remember input{accent-color:var(--clay);}
  .forgot{font-size:13px; color:var(--clay); font-weight:600;}
  .forgot:hover{text-decoration:underline;}

  .submit-btn{
    width:100%; background:var(--ink); color:var(--paper); border:none;
    padding:16px; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600;
    cursor:pointer; transition:background .3s ease;
  }
  .submit-btn:hover{background:var(--clay);}

  .divider{display:flex; align-items:center; gap:16px; margin:30px 0; color:var(--ink-soft); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;}
  .divider:before, .divider:after{content:""; flex:1; height:1px; background:var(--line);}

  .social-row{display:flex; gap:12px;}
  .social-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:10px;
    border:1px solid var(--line); padding:12px; font-size:13px; font-weight:500;
    background:var(--sand-2); transition:.25s;
  }
  .social-btn:hover{border-color:var(--clay); background:var(--paper);}

  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:16px 26px; border-radius:3px;
    font-size:14px; z-index:999; opacity:0; pointer-events:none; transition:.4s ease;
    border:1px solid var(--gold-light); box-shadow:0 20px 40px -15px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:900px){
    .auth-shell{grid-template-columns:1fr;}
    .auth-visual{min-height:280px;}
    .auth-visual-content{left:24px; right:24px; bottom:28px;}
    .auth-visual-content .quote{font-size:20px;}
    .auth-form-side{padding:48px 24px;}
    .topbar{padding:22px 24px;}
  }

  /* ===== WHATSAPP FLOAT BUTTON ===== */
  .whatsapp-float{
    position:fixed; bottom:26px; left:26px; z-index:200;
    width:58px; height:58px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 28px -8px rgba(0,0,0,0.45);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .whatsapp-float:hover{transform:scale(1.08); box-shadow:0 16px 34px -8px rgba(0,0,0,0.55);}
  .whatsapp-float svg{width:29px; height:29px;}
  @media (max-width:760px){
    .whatsapp-float{width:52px; height:52px; bottom:20px; left:20px;}
    .whatsapp-float svg{width:26px; height:26px;}
  }
</style>
<style>
/* ===== HEWA SAFARIS — SHARED CAMP CART WIDGET ===== */
.cart-float{
  position:fixed; bottom:26px; right:26px; z-index:210;
  width:58px; height:58px; border-radius:50%;
  background:#1B1712; display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 28px -8px rgba(0,0,0,0.45);
  transition:transform .25s ease, box-shadow .25s ease;
  border:1px solid #D1A550; cursor:pointer;
}
.cart-float:hover{transform:scale(1.08); box-shadow:0 16px 34px -8px rgba(0,0,0,0.55);}
.cart-float svg{width:25px; height:25px;}
.cart-badge{
  position:absolute; top:-6px; right:-6px;
  background:#C1701E; color:#FAF5EA; font-family:'Playfair Display',serif;
  font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; padding:0 5px;
  border:2px solid #FAF5EA;
}
.cart-badge.hidden{display:none;}

.cart-overlay{
  position:fixed; inset:0; background:rgba(20,17,12,0.55); z-index:220;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.cart-overlay.open{opacity:1; pointer-events:auto;}

.cart-drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:221;
  width:400px; max-width:92vw; background:#FAF5EA; color:#1B1712;
  box-shadow:-20px 0 50px -20px rgba(0,0,0,0.5);
  transform:translateX(100%); transition:transform .35s cubic-bezier(.2,.7,.2,1);
  display:flex; flex-direction:column; font-family:'Playfair Display',serif;
}
.cart-drawer.open{transform:translateX(0);}
.cart-head{
  padding:26px 26px 18px; border-bottom:1px solid rgba(27,23,18,0.14);
  display:flex; align-items:center; justify-content:space-between;
}
.cart-head h3{margin:0; font-size:20px; font-weight:600;}
.cart-close{background:none; border:none; cursor:pointer; font-size:22px; line-height:1; color:#1B1712; padding:4px;}
.cart-sub{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#96551A; font-weight:600; padding:14px 26px 0;}
.cart-items{flex:1; overflow-y:auto; padding:10px 26px 20px;}
.cart-empty{padding:40px 0; text-align:center; color:#2A241C; opacity:0.65; font-size:14px;}
.cart-item{
  display:flex; gap:12px; padding:16px 0; border-bottom:1px solid rgba(27,23,18,0.1);
}
.cart-item-info{flex:1;}
.cart-item-tier{font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#C1701E; font-weight:700;}
.cart-item-name{font-size:15px; font-weight:500; margin-top:4px;}
.cart-item-dest{font-size:12px; color:#2A241C; opacity:0.7; margin-top:2px;}
.cart-item-price{font-size:13px; color:#1B1712; margin-top:6px; font-weight:600;}
.cart-item-remove{
  background:none; border:none; cursor:pointer; color:#96551A; font-size:12px;
  text-decoration:underline; align-self:flex-start; padding:0; font-family:'Playfair Display',serif;
}
.cart-foot{border-top:1px solid rgba(27,23,18,0.14); padding:20px 26px 26px;}
.cart-total-row{display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; color:#2A241C;}
.cart-total-row b{font-size:20px; color:#C1701E; font-family:'Playfair Display',serif;}
.cart-note{font-size:11px; color:#2A241C; opacity:0.65; margin:8px 0 18px; line-height:1.5; font-style:italic;}
.cart-actions{display:flex; flex-direction:column; gap:10px;}
.cart-btn{
  display:block; width:100%; text-align:center; padding:14px; font-size:12px;
  letter-spacing:0.1em; text-transform:uppercase; font-weight:600; border-radius:2px;
  cursor:pointer; border:1px solid transparent; font-family:'Playfair Display',serif;
  box-sizing:border-box;
}
.cart-btn-primary{background:#25D366; color:#0f2a17; border-color:#25D366;}
.cart-btn-primary:hover{opacity:0.9;}
.cart-btn-secondary{background:#1B1712; color:#FAF5EA; border-color:#1B1712;}
.cart-btn-secondary:hover{background:transparent; color:#1B1712;}
.cart-btn-clear{background:none; color:#96551A; text-decoration:underline; font-weight:500; letter-spacing:0.02em; text-transform:none; font-size:12px;}

.cart-toast{
  position:fixed; bottom:96px; right:26px; z-index:230;
  background:#1B1712; color:#FAF5EA; padding:13px 20px; border-radius:3px;
  font-size:13px; font-family:'Playfair Display',serif; opacity:0; transform:translateY(10px);
  transition:.35s ease; pointer-events:none; border:1px solid #D1A550; max-width:260px;
}
.cart-toast.show{opacity:1; transform:translateY(0);}

/* ===== TIER PICKER (used on destinations.html and package pages) ===== */
.tier-legend{display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 6px;}
.tier-pill{
  font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:600;
  padding:6px 14px; border-radius:20px; border:1px solid rgba(27,23,18,0.18); color:#2A241C;
}
.tier-pill.tier-budget{border-color:#4C7A4C; color:#2f5230;}
.tier-pill.tier-mid{border-color:#B8893A; color:#96551A;}
.tier-pill.tier-luxury{border-color:#C1701E; color:#C1701E;}
.tier-pill.tier-ultra{border-color:#1B1712; color:#1B1712; background:#EADFC7;}

.tier-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:26px;}
.tier-card{
  background:#FAF5EA; border:1px solid rgba(27,23,18,0.14); border-radius:6px; overflow:hidden;
  display:flex; flex-direction:column;
}
.tier-card-img{height:150px; width:100%; object-fit:cover; display:block; filter:saturate(0.95);}
.tier-card-body{padding:18px 18px 20px; display:flex; flex-direction:column; flex:1;}
.tier-badge{
  align-self:flex-start; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700;
  padding:4px 10px; border-radius:12px; margin-bottom:10px;
}
.tier-badge.tier-budget{background:#e7efe4; color:#2f5230;}
.tier-badge.tier-mid{background:#f4e9d3; color:#96551A;}
.tier-badge.tier-luxury{background:#f6ddc4; color:#a1500f;}
.tier-badge.tier-ultra{background:#1B1712; color:#D1A550;}
.tier-card h4{font-size:16px; font-weight:600; line-height:1.3;}
.tier-card .tier-desc{font-size:12.5px; color:#2A241C; opacity:0.8; line-height:1.55; margin-top:8px; flex:1;}
.tier-card .tier-price{margin-top:14px; font-size:17px; font-weight:700; color:#C1701E;}
.tier-card .tier-price span{display:block; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:#2A241C; opacity:0.65; margin-top:2px;}
.tier-add-btn{
  margin-top:14px; width:100%; padding:11px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  font-weight:600; background:#1B1712; color:#FAF5EA; border:1px solid #1B1712; cursor:pointer; border-radius:2px;
  transition:.25s ease; font-family:'Playfair Display',serif;
}
.tier-add-btn:hover{background:#C1701E; border-color:#C1701E;}
.tier-add-btn.added{background:#4C7A4C; border-color:#4C7A4C;}

.pkg-locations{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
.loc-chip{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
  padding:8px 16px; border-radius:20px; border:1px solid #C1701E; color:#C1701E; transition:.25s ease;
}
.loc-chip:hover{background:#C1701E; color:#FAF5EA;}
.loc-chip svg{width:12px; height:12px;}

.dest-link{
  display:inline-block; margin-top:12px; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  font-weight:600; color:#D1A550; border-bottom:1px solid rgba(209,165,80,0.5); padding-bottom:2px;
}
.dest-link:hover{color:#FAF5EA; border-color:#FAF5EA;}

.pkg-camps-section{padding:0 0 100px;}
.pkg-camps-photo{display:block;width:100%;max-width:100%;height:220px;object-fit:cover;border-radius:6px;margin-top:22px;box-shadow:0 18px 38px -18px rgba(27,23,18,0.4);}
@media (max-width:760px){.pkg-camps-photo{height:170px;}}
.pkg-camps-head{max-width:680px; margin-bottom:8px;}
.pkg-camps-head h2{font-size:clamp(26px,3.2vw,36px); margin-top:12px;}
.pkg-camps-head p{font-size:15px; line-height:1.8; color:#2A241C; margin-top:14px;}
.pkg-camps-more{margin-top:24px; text-align:center;}
.pkg-camps-more a{
  display:inline-block; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600;
  color:#C1701E; border-bottom:1px solid #C1701E; padding-bottom:2px;
}

@media (max-width:1080px){
  .tier-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:760px){
  .tier-grid{grid-template-columns:1fr;}
  .cart-drawer{width:100vw;}
  .cart-float{right:20px; bottom:20px; width:52px; height:52px;}
  .cart-float svg{width:22px; height:22px;}
}

</style>
<script defer>
/* ===== HEWA SAFARIS — SHARED CAMP CART ===== */
(function(){
  var STORAGE_KEY = 'hewaCart';
  var WHATSAPP_NUMBER = '254700123456';

  function readCart(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function writeCart(items){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){}
  }
  function money(n){
    return '$' + Number(n).toLocaleString('en-US');
  }

  function buildUI(){
    var overlay = document.createElement('div');
    overlay.className = 'cart-overlay';
    overlay.id = 'hewaCartOverlay';

    var drawer = document.createElement('div');
    drawer.className = 'cart-drawer';
    drawer.id = 'hewaCartDrawer';
    drawer.innerHTML =
      '<div class="cart-head">' +
        '<h3>Your Camp List</h3>' +
        '<button class="cart-close" id="hewaCartClose" aria-label="Close cart">&times;</button>' +
      '</div>' +
      '<span class="cart-sub">Selections from across Hewa Safaris</span>' +
      '<div class="cart-items" id="hewaCartItems"></div>' +
      '<div class="cart-foot">' +
        '<div class="cart-total-row"><span>Estimated total / night</span><b id="hewaCartTotal">$0</b></div>' +
        '<p class="cart-note">Estimates only, per person sharing. Nothing here is booked — a trip designer confirms final rates and availability once you send your list.</p>' +
        '<div class="cart-actions">' +
          '<a class="cart-btn cart-btn-primary" id="hewaCartWhatsapp" href="#" target="_blank" rel="noopener">Send List on WhatsApp</a>' +
          '<a class="cart-btn cart-btn-secondary" id="hewaCartEmail" href="#">Email This List</a>' +
          '<button class="cart-btn cart-btn-clear" id="hewaCartClear" type="button">Clear list</button>' +
        '</div>' +
      '</div>';

    var floatBtn = document.createElement('button');
    floatBtn.className = 'cart-float';
    floatBtn.id = 'hewaCartFloat';
    floatBtn.type = 'button';
    floatBtn.setAttribute('aria-label', 'Open your camp list');
    floatBtn.innerHTML =
      '<svg width="23" height="23" viewBox="0 0 24 24" fill="#D1A550" stroke="none"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2.5 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>' +
      '<span class="cart-badge hidden" id="hewaCartBadge">0</span>';

    document.body.appendChild(overlay);
    document.body.appendChild(drawer);
    document.body.appendChild(floatBtn);

    floatBtn.addEventListener('click', openDrawer);
    overlay.addEventListener('click', closeDrawer);
    document.getElementById('hewaCartClose').addEventListener('click', closeDrawer);
    document.getElementById('hewaCartClear').addEventListener('click', function(){
      if(confirm('Clear every camp from your list?')){
        writeCart([]);
        render();
      }
    });
  }

  function openDrawer(){
    document.getElementById('hewaCartDrawer').classList.add('open');
    document.getElementById('hewaCartOverlay').classList.add('open');
  }
  function closeDrawer(){
    document.getElementById('hewaCartDrawer').classList.remove('open');
    document.getElementById('hewaCartOverlay').classList.remove('open');
  }

  function render(){
    var items = readCart();
    var badge = document.getElementById('hewaCartBadge');
    var list = document.getElementById('hewaCartItems');
    var totalEl = document.getElementById('hewaCartTotal');
    var waLink = document.getElementById('hewaCartWhatsapp');
    var emailLink = document.getElementById('hewaCartEmail');

    if(items.length === 0){
      badge.classList.add('hidden');
      badge.textContent = '0';
      list.innerHTML = '<div class="cart-empty">Your list is empty. Browse camps &amp; stays on any journey or the Destinations page and tap "Add to Camp List".</div>';
    } else {
      badge.classList.remove('hidden');
      badge.textContent = items.length;
      list.innerHTML = items.map(function(item, i){
        return '<div class="cart-item">' +
          '<div class="cart-item-info">' +
            '<div class="cart-item-tier">' + item.tier + '</div>' +
            '<div class="cart-item-name">' + item.name + '</div>' +
            '<div class="cart-item-dest">' + item.destination + '</div>' +
            '<div class="cart-item-price">' + money(item.price) + ' / night, per person</div>' +
          '</div>' +
          '<button class="cart-item-remove" data-idx="' + i + '" type="button">Remove</button>' +
        '</div>';
      }).join('');
      list.querySelectorAll('.cart-item-remove').forEach(function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-idx'), 10);
          var current = readCart();
          current.splice(idx, 1);
          writeCart(current);
          render();
        });
      });
    }

    var total = items.reduce(function(sum, it){ return sum + Number(it.price || 0); }, 0);
    totalEl.textContent = money(total);

    var lines = items.map(function(it){ return '- ' + it.name + ' (' + it.tier + ', ' + it.destination + ') ~' + money(it.price) + '/night pp'; });
    var msg = items.length
      ? 'Hi Hewa Safaris, I\'d like to enquire about a trip using this camp list:\n' + lines.join('\n') + '\n\nEstimated total: ' + money(total) + ' per night, per person.'
      : 'Hi Hewa Safaris, I\'d like to know more about your safari packages.';
    waLink.href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);

    var subject = 'My Hewa Safaris camp list';
    var body = items.length
      ? lines.join('\n') + '\n\nEstimated total: ' + money(total) + ' per night, per person.'
      : 'I have not added any camps yet.';
    emailLink.href = 'mailto:hello@hewasafaris.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  function showToast(msg){
    var toast = document.getElementById('hewaCartToast');
    if(!toast){
      toast = document.createElement('div');
      toast.className = 'cart-toast';
      toast.id = 'hewaCartToast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
  }

  function add(item){
    var items = readCart();
    items.push({
      name: item.name,
      tier: item.tier,
      destination: item.destination,
      price: Number(item.price) || 0
    });
    writeCart(items);
    render();
    showToast(item.name + ' added to your camp list');
  }

  function wireAddButtons(){
    document.querySelectorAll('.tier-add-btn[data-name]').forEach(function(btn){
      btn.addEventListener('click', function(){
        add({
          name: btn.getAttribute('data-name'),
          tier: btn.getAttribute('data-tier'),
          destination: btn.getAttribute('data-destination'),
          price: btn.getAttribute('data-price')
        });
        var original = btn.textContent;
        btn.textContent = 'Added ✓';
        btn.classList.add('added');
        setTimeout(function(){ btn.textContent = original; btn.classList.remove('added'); }, 1600);
      });
    });
  }

  function init(){
    buildUI();
    render();
    wireAddButtons();
  }

  window.HewaCart = { add: add };

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
